<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>CBT Bridge AI — 用語辞典</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
      background: #fafbfc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 380px; /* 初期幅を広くする */
    }
    .header {
      padding: 14px 16px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 14px; font-weight: 600; display:flex; align-items:center; gap:6px; }
    .header .count { font-size: 12px; opacity: 0.8; }

    .search-bar {
      padding: 8px 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .search-bar input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .search-bar input:focus { border-color: #3b82f6; }

    .term-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .term-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #f1f5f9;
      gap: 8px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .term-item:hover { background: #f8fafc; }
    .term-info { flex: 1; min-width: 0; }
    .term-original { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .term-translation { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .term-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e0f2fe;
      color: #0284c7;
      white-space: nowrap;
    }
    .term-badge.preset { background: #dbeafe; color: #2563eb; }
    .term-badge.ai { background: #ede9fe; color: #7c3aed; }
    .term-badge.user { background: #dcfce7; color: #16a34a; }

    .term-actions {
      display: flex;
      gap: 4px;
    }
    .term-actions button {
      width: 28px; height: 28px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
      color: #94a3b8;
    }
    .term-actions button:hover { background: #f1f5f9; color: #475569; }

    .add-bar {
      padding: 12px 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
    }
    .add-bar input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .add-bar input:focus { border-color: #3b82f6; }
    .add-bar button {
      padding: 8px 14px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .add-bar button:hover { opacity: 0.9; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* インライン編集フォーム */
    .term-edit-form {
      padding: 10px 16px 12px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .term-edit-form input {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: white;
    }
    .term-edit-form input:focus { border-color: #3b82f6; }
    .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-save {
      padding: 5px 14px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white; border: none; border-radius: 7px;
      font-size: 12px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .btn-cancel {
      padding: 5px 10px;
      background: none; border: 1px solid #e2e8f0;
      color: #64748b; border-radius: 7px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
      用語辞典
    </h1>
    <span class="count" id="term-count">0 terms</span>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="用語を検索..." />
  </div>

  <div class="term-list" id="term-list">
    <div class="empty">用語を読み込み中...</div>
  </div>

  <div class="add-bar">
    <input type="text" id="add-original" placeholder="英語用語" />
    <input type="text" id="add-translation" placeholder="日本語訳" />
    <button id="btn-add">追加</button>
  </div>

  <script src="sidepanel.ts" type="module"></script>
</body>
</html>
