<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>CBT Bridge AI — 翻訳ビュー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Inter", system-ui, sans-serif;
      background: #fafbfc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 10px 16px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header-actions { display: flex; gap: 6px; }
    .header-btn {
      padding: 4px 10px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .header-btn:hover { background: rgba(255,255,255,0.25); }

    .status-bar {
      padding: 6px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
      color: #64748b;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .paragraph-block {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      line-height: 1.8;
      font-size: 15px;
      transition: background 0.2s;
    }
    .paragraph-block.active {
      background: rgba(59, 130, 246, 0.06);
      border-left: 3px solid #3b82f6;
    }
    .paragraph-block.loading {
      color: #94a3b8;
      font-style: italic;
    }
    .paragraph-block .term-highlight {
      background: rgba(99, 102, 241, 0.1);
      border-bottom: 1px dashed #6366f1;
      cursor: help;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      text-align: center;
      gap: 12px;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 CBT Bridge AI — 翻訳</h1>
    <div class="header-actions">
      <button class="header-btn" id="btn-translate-all">📄 全文翻訳</button>
      <button class="header-btn" id="btn-close">✕ 閉じる</button>
    </div>
  </div>

  <div class="status-bar" id="status-bar">🔗 接続待ち...</div>

  <div class="content" id="content">
    <div class="empty-state">
      <div class="icon">🌐</div>
      <p>元のページから翻訳するテキストを待っています。<br/>🌐 翻訳ボタンをクリック、または「全文翻訳」を押してください。</p>
    </div>
  </div>

  <script src="splitview.ts" type="module"></script>
</body>
</html>
